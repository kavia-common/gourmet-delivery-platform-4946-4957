<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cart Drawer — Gourmet Delivery (Mockups)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="../styles/tokens.css" rel="stylesheet" />
  <link href="../styles/base.css" rel="stylesheet" />
  <link href="../styles/components.css" rel="stylesheet" />
  <link href="../styles/layouts.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded" />
  <style>
    .drawer-panel {
      transform: translateX(100%); transition: transform .25s ease;
    }
    .drawer[data-state="open"] .drawer-panel { transform: translateX(0); }
  </style>
</head>
<body>
  <header class="navbar" role="banner">
    <div class="container inner">
      <a class="brand" href="../index.html">
        <img src="../assets/logo.svg" alt="" width="24" height="24" />
        <span>Gourmet Delivery</span>
      </a>
      <nav>
        <button class="btn btn-secondary" id="openCart" aria-haspopup="dialog" aria-controls="cartDrawer">Open Cart</button>
      </nav>
    </div>
  </header>

  <main class="container" role="main">
    <section class="mt-6">
      <h1 style="margin:0; font-size: var(--font-size-2xl);">Cart Drawer Demo</h1>
      <p class="muted mt-2">Click "Open Cart" to see the slide-over with overlay.</p>
    </section>
  </main>

  <div class="drawer" id="cartDrawer" data-state="closed" role="dialog" aria-modal="true" aria-label="Cart drawer" hidden>
    <div onclick="closeDrawer()" aria-hidden="true"></div>
    <aside class="panel drawer-panel" role="complementary">
      <div class="flex items-center justify-between">
        <h2 style="margin:0;">Your Cart</h2>
        <button class="btn btn-tertiary" onclick="closeDrawer()" aria-label="Close cart">Close</button>
      </div>
      <div class="mt-4" id="cart-items"></div>
      <div class="mt-4 surface p-4">
        <div class="flex items-center justify-between"><span class="muted">Subtotal</span><strong id="subtotal">$0.00</strong></div>
        <div class="flex items-center justify-between"><span class="muted">Delivery</span><strong id="delivery">$4.99</strong></div>
        <hr class="mt-3" style="border: none; border-top:1px solid var(--color-border);" />
        <div class="flex items-center justify-between"><span>Total</span><strong id="total">$0.00</strong></div>
        <a class="btn btn-primary mt-3" href="./checkout.html">Checkout</a>
      </div>
    </aside>
  </div>

  <script>
    const cart = [
      { id:'m1', name:'Seared Tuna Bowl', price:16.5, qty:1 },
      { id:'m2', name:'Miso Glazed Salmon', price:19.0, qty:2 }
    ];
    const itemsEl = document.getElementById('cart-items');
    function render() {
      itemsEl.innerHTML = '';
      cart.forEach(it => {
        const row = document.createElement('div');
        row.className = 'surface p-4 mt-2';
        row.innerHTML = `
          <div class="flex items-center justify-between">
            <div>
              <div style="font-weight:700">${it.name}</div>
              <div class="muted">$${it.price.toFixed(2)}</div>
            </div>
            <div class="stepper">
              <button aria-label="Decrease" onclick="updateQty('${it.id}', Math.max(1, ${it.qty}-1))">-</button>
              <div class="value" aria-live="polite">${it.qty}</div>
              <button aria-label="Increase" onclick="updateQty('${it.id}', ${it.qty}+1)">+</button>
            </div>
          </div>
        `;
        itemsEl.appendChild(row);
      });
      const subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);
      document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
      const delivery = cart.length ? 4.99 : 0;
      document.getElementById('delivery').textContent = `$${delivery.toFixed(2)}`;
      document.getElementById('total').textContent = `$${(subtotal+delivery).toFixed(2)}`;
    }
    function updateQty(id, qty) { const it=cart.find(i=>i.id===id); if(it){it.qty=qty; render();} }
    function openDrawer(){
      const el=document.getElementById('cartDrawer');
      el.dataset.state='open'; el.hidden=false;
      setTimeout(()=>document.getElementById('openCart').focus(), 0);
    }
    function closeDrawer(){
      const el=document.getElementById('cartDrawer');
      el.dataset.state='closed'; el.hidden=true;
      document.getElementById('openCart').focus();
    }
    document.getElementById('openCart').addEventListener('click', openDrawer);
    render();
  </script>
</body>
</html>
