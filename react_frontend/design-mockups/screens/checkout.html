<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Checkout — Gourmet Delivery (Mockups)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="../styles/tokens.css" rel="stylesheet" />
  <link href="../styles/base.css" rel="stylesheet" />
  <link href="../styles/components.css" rel="stylesheet" />
  <link href="../styles/layouts.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded" />
</head>
<body>
  <header class="navbar" role="banner">
    <div class="container inner">
      <a class="brand" href="../index.html">
        <img src="../assets/logo.svg" alt="" width="24" height="24" />
        <span>Gourmet Delivery</span>
      </a>
      <nav>
        <a class="btn btn-outline" href="./home.html">Back</a>
      </nav>
    </div>
  </header>

  <main class="container" role="main">
    <h1 class="mt-6" style="margin:0; font-size: var(--font-size-2xl);">Checkout</h1>
    <div class="grid-12 mt-4">
      <section class="col-span-12 lg:col-span-8">
        <div class="surface p-4">
          <h2 style="margin:0 0 8px; font-size: var(--font-size-xl);">Delivery details</h2>
          <form class="grid-12">
            <div class="col-span-12 md:col-span-6">
              <label class="label" for="name">Full Name</label>
              <input id="name" class="input" placeholder="Jane Doe" />
            </div>
            <div class="col-span-12 md:col-span-6">
              <label class="label" for="phone">Phone</label>
              <input id="phone" class="input" placeholder="+1 (555) 555-1234" />
            </div>
            <div class="col-span-12">
              <label class="label" for="address">Address</label>
              <input id="address" class="input" placeholder="123 Ocean Ave" />
              <span class="hint">Delivery within 5km is free for orders over $50.</span>
            </div>
            <div class="col-span-12 md:col-span-8">
              <label class="label" for="instructions">Instructions</label>
              <textarea id="instructions" class="input" rows="3" placeholder="Ring the bell, leave at door"></textarea>
            </div>
            <div class="col-span-12 md:col-span-4">
              <label class="label" for="time">Time</label>
              <select id="time" class="input">
                <option>ASAP</option><option>In 30 minutes</option><option>In 1 hour</option>
              </select>
            </div>
          </form>
        </div>

        <div class="surface p-4 mt-4">
          <h2 style="margin:0 0 8px; font-size: var(--font-size-xl);">Payment</h2>
          <form class="grid-12">
            <div class="col-span-12">
              <label class="control">
                <input type="checkbox" class="switch-input" checked />
                <span class="switch" aria-hidden="true"></span>
                <span>Save payment method</span>
              </label>
            </div>
            <div class="col-span-12 md:col-span-8">
              <label class="label" for="card">Card number</label>
              <input id="card" class="input" placeholder="4242 4242 4242 4242" inputmode="numeric" />
            </div>
            <div class="col-span-12 md:col-span-2">
              <label class="label" for="exp">Exp</label>
              <input id="exp" class="input" placeholder="MM/YY" />
            </div>
            <div class="col-span-12 md:col-span-2">
              <label class="label" for="cvv">CVV</label>
              <input id="cvv" class="input" placeholder="123" />
            </div>
          </form>
        </div>
      </section>

      <aside class="col-span-12 lg:col-span-4" aria-label="Order summary">
        <div class="surface p-4">
          <h2 style="margin:0 0 8px; font-size: var(--font-size-xl);">Summary</h2>
          <div id="summary-items"></div>
          <hr class="mt-3" style="border:none; border-top:1px solid var(--color-border);" />
          <div class="flex items-center justify-between mt-2"><span class="muted">Subtotal</span><strong id="subtotal">$0.00</strong></div>
          <div class="flex items-center justify-between mt-2"><span class="muted">Delivery</span><strong id="delivery">$0.00</strong></div>
          <div class="flex items-center justify-between mt-2"><span>Total</span><strong id="total">$0.00</strong></div>
          <button class="btn btn-primary mt-3" onclick="placeOrder()">Place order</button>
        </div>
      </aside>
    </div>
  </main>

  <script>
    const cart = [
      { name:'Seared Tuna Bowl', price:16.5, qty:1 },
      { name:'Miso Glazed Salmon', price:19.0, qty:2 }
    ];
    function renderSummary(){
      const wrap = document.getElementById('summary-items');
      wrap.innerHTML = '';
      cart.forEach(i=>{
        const row = document.createElement('div');
        row.className='flex items-center justify-between';
        row.innerHTML = `<span>${i.name} × ${i.qty}</span><span>$${(i.price*i.qty).toFixed(2)}</span>`;
        wrap.appendChild(row);
      });
      const subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);
      const delivery = 4.99;
      document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
      document.getElementById('delivery').textContent = `$${delivery.toFixed(2)}`;
      document.getElementById('total').textContent = `$${(subtotal+delivery).toFixed(2)}`;
    }
    function placeOrder(){
      alert('Order placed (mock)!');
      window.location.href = './order-tracking.html';
    }
    renderSummary();
  </script>
</body>
</html>
